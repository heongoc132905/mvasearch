
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>MVA Search</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --header: rgba(11, 16, 32, .86);
      --surface: #121a2c;
      --surface-hover: #19243a;
      --text: #edf2ff;
      --muted: #8c9ab5;
      --border: rgba(148, 163, 184, .14);
      --accent: #7c8cff;
      --accent-2: #a78bfa;
      --green: #42d6a4;
      --shadow: 0 18px 50px rgba(0, 0, 0, .22);
      --radius: 18px;
    }

    body.light {
      color-scheme: light;
      --bg: #f5f7fb;
      --header: rgba(255, 255, 255, .88);
      --surface: #ffffff;
      --surface-hover: #f0f3fa;
      --text: #172033;
      --muted: #68758d;
      --border: rgba(30, 41, 59, .12);
      --accent: #5968e8;
      --accent-2: #8b5cf6;
      --green: #07865e;
      --shadow: 0 18px 50px rgba(30, 41, 59, .08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 15% -10%, rgba(99, 102, 241, .14), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      transition: background .25s ease, color .25s ease;
    }

    button, input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .material-symbols-rounded {
      font-size: 21px;
      line-height: 1;
      user-select: none;
    }

    /* Header */
    .search-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 17px clamp(18px, 4vw, 56px);
      background: var(--header);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      text-decoration: none;
      color: var(--text);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 13px;
      color: white;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #6678ff, #9b6dff);
      box-shadow: 0 6px 22px rgba(102, 120, 255, .28);
    }

    .brand-name {
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -.7px;
    }

    .brand-name span {
      color: var(--accent);
    }

    .search-form {
      display: flex;
      align-items: center;
      width: min(720px, 100%);
      min-width: 0;
      height: 48px;
      padding: 0 7px 0 17px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .search-form:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(124, 140, 255, .12);
    }

    .search-form input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 14px;
    }

    .search-form input::placeholder {
      color: var(--muted);
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background .18s, color .18s, transform .18s;
    }

    .icon-button:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .icon-button:active {
      transform: scale(.94);
    }

    .search-submit {
      color: white;
      background: linear-gradient(135deg, #6879ff, #8c6dff);
    }

    .search-submit:hover {
      color: white;
      filter: brightness(1.08);
      background: linear-gradient(135deg, #6879ff, #8c6dff);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Main content */
    .main {
      width: min(100% - 40px, 1050px);
      margin: 0 auto;
      padding: 34px 0 80px;
    }

    .results-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .results-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }

    .results-title strong {
      color: var(--text);
      font-weight: 600;
    }

    .powered-by {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .powered-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(66, 214, 164, .4);
    }

    .results-panel {
      min-height: 300px;
    }

    /* Google CSE overrides */
    .gsc-control-cse,
    .gsc-control-cse-en {
      padding: 0 !important;
      border: 0 !important;
      background: transparent !important;
      font-family: Inter, system-ui, sans-serif !important;
    }

    .gsc-control-cse table,
    .gsc-control-cse tbody,
    .gsc-control-cse tr,
    .gsc-control-cse td {
      background: transparent !important;
      border: 0 !important;
    }

    .gsc-results-wrapper-overlay {
      background: var(--surface) !important;
    }

    .gsc-results {
      width: 100% !important;
    }

    .gsc-webResult.gsc-result,
    .gsc-imageResult {
      padding: 20px 22px !important;
      margin: 0 0 12px !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      background: var(--surface) !important;
      transition: border-color .2s, transform .2s, box-shadow .2s !important;
    }

    .gsc-webResult.gsc-result:hover,
    .gsc-imageResult:hover {
      border-color: rgba(124, 140, 255, .45) !important;
      box-shadow: var(--shadow) !important;
      transform: translateY(-2px);
    }

    .gs-title,
    .gs-title *,
    .gsc-webResult .gs-title,
    .gsc-webResult .gs-title * {
      color: var(--accent) !important;
      font-family: Inter, system-ui, sans-serif !important;
      font-size: 18px !important;
      font-weight: 650 !important;
      line-height: 1.45 !important;
      text-decoration: none !important;
    }

    .gs-title:hover,
    .gs-title *:hover {
      text-decoration: underline !important;
    }

    .gsc-url-top,
    .gsc-url-bottom,
    .gs-visibleUrl {
      color: var(--green) !important;
      font-size: 12px !important;
      line-height: 1.5 !important;
    }

    .gs-snippet {
      margin-top: 9px !important;
      color: var(--text) !important;
      font-family: Inter, system-ui, sans-serif !important;
      font-size: 13px !important;
      line-height: 1.75 !important;
      opacity: .78;
    }

    .gs-snippet b,
    .gs-snippet strong {
      color: var(--text) !important;
      font-weight: 700 !important;
      opacity: 1;
    }

    .gsc-above-wrapper-area,
    .gcsc-branding,
    .gsc-thumbnail-inside,
    .gsc-url-bottom,
    .gsc-result-info,
    .gsc-orderby-container {
      display: none !important;
    }

    .gsc-cursor-box {
      display: flex !important;
      justify-content: center !important;
      flex-wrap: wrap;
      gap: 7px !important;
      margin: 30px 0 0 !important;
    }

    .gsc-cursor-page {
      display: grid !important;
      place-items: center;
      min-width: 38px;
      height: 38px;
      padding: 0 12px !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      background: var(--surface) !important;
      color: var(--text) !important;
      font-size: 13px !important;
      text-decoration: none !important;
      transition: .18s !important;
    }

    .gsc-cursor-page:hover {
      border-color: var(--accent) !important;
      background: var(--surface-hover) !important;
    }

    .gsc-cursor-current-page {
      border-color: var(--accent) !important;
      background: var(--accent) !important;
      color: white !important;
      font-weight: 700 !important;
    }

    .gsc-results .gsc-cursor-box .gsc-cursor-page {
      margin: 0 !important;
    }

    .gsc-table-result,
    .gsc-thumbnail {
      border: 0 !important;
    }

    .gs-image-box img,
    .gs-image {
      border-radius: 10px !important;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 0 0;
      margin-top: 42px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .footer strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Responsive */
    @media (max-width: 720px) {
      .search-header {
        flex-wrap: wrap;
        gap: 12px;
        padding: 12px 16px;
      }

      .brand {
        flex: 1;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 11px;
      }

      .brand-name {
        font-size: 16px;
      }

      .search-form {
        order: 3;
        width: 100%;
        max-width: none;
        height: 46px;
      }

      .header-actions {
        order: 2;
      }

      .main {
        width: calc(100% - 28px);
        padding-top: 24px;
      }

      .results-heading {
        align-items: flex-start;
      }

      .gsc-webResult.gsc-result,
      .gsc-imageResult {
        padding: 16px !important;
        border-radius: 15px !important;
      }

      .gs-title,
      .gs-title *,
      .gsc-webResult .gs-title,
      .gsc-webResult .gs-title * {
        font-size: 16px !important;
      }

      .footer {
        flex-direction: column;
        gap: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="search-header">
    <a class="brand" href="mva-search.html" aria-label="MVA Search home">
      <span class="brand-mark">M</span>
      <span class="brand-name">MVA <span>Search</span></span>
    </a>

    <form class="search-form" id="searchForm">
      <input
        id="searchInput"
        name="q"
        type="search"
        placeholder="Tìm kiếm trên Internet..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Từ khóa tìm kiếm"
      >
      <button class="icon-button" id="clearButton" type="button" aria-label="Xóa nội dung" title="Xóa">
        <span class="material-symbols-rounded">close</span>
      </button>
      <button class="icon-button search-submit" type="submit" aria-label="Tìm kiếm" title="Tìm kiếm">
        <span class="material-symbols-rounded">search</span>
      </button>
    </form>

    <div class="header-actions">
      <button class="icon-button" id="themeButton" type="button" aria-label="Đổi giao diện" title="Đổi giao diện">
        <span class="material-symbols-rounded" id="themeIcon">light_mode</span>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="results-heading">
      <p class="results-title" id="resultsTitle">Kết quả tìm kiếm</p>
      <div class="powered-by">
        <span class="powered-dot"></span>
        Powered by Google
      </div>
    </div>

    <section class="results-panel" aria-label="Kết quả tìm kiếm">
      <script async src="https://cse.google.com/cse.js?cx=c789708b9032d4eee"></script>
      <div class="gcse-searchresults-only" data-queryParameterName="q"></div>
    </section>

    <footer class="footer">
      <span><strong>MVA Search</strong> · Tìm kiếm thông minh hơn</span>
      <span>by MVA Technology</span>
    </footer>
  </main>

  <script>
    const searchInput = document.getElementById("searchInput");
    const searchForm = document.getElementById("searchForm");
    const clearButton = document.getElementById("clearButton");
    const themeButton = document.getElementById("themeButton");
    const themeIcon = document.getElementById("themeIcon");
    const resultsTitle = document.getElementById("resultsTitle");

    const params = new URLSearchParams(window.location.search);
    const initialQuery = params.get("q") || "";

    searchInput.value = initialQuery;

    if (initialQuery) {
      document.title = `${initialQuery} - MVA Search`;
      resultsTitle.innerHTML =
        `Kết quả cho <strong>${escapeHtml(initialQuery)}</strong>`;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    searchForm.addEventListener("submit", event => {
      event.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;

      window.location.href =
        `mva-search.html?q=${encodeURIComponent(query)}`;
    });

    clearButton.addEventListener("click", () => {
      searchInput.value = "";
      searchInput.focus();
    });

    function setTheme(theme) {
      const isLight = theme === "light";
      document.body.classList.toggle("light", isLight);
      themeIcon.textContent = isLight ? "dark_mode" : "light_mode";
      document.querySelector('meta[name="theme-color"]').content =
        isLight ? "#f5f7fb" : "#0b1020";

      try {
        localStorage.setItem("mva-search-theme", theme);
      } catch (_) {}
    }

    let savedTheme = "dark";
    try {
      savedTheme = localStorage.getItem("mva-search-theme") || "dark";
    } catch (_) {}

    setTheme(savedTheme);

    themeButton.addEventListener("click", () => {
      const nextTheme = document.body.classList.contains("light")
        ? "dark"
        : "light";
      setTheme(nextTheme);
    });
  </script>
</body>
</html>
